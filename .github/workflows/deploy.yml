# Uploads the website to maxdodson.co.uk over SFTP.
# Runs automatically when changes reach main, or by hand from the Actions tab.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER    your host's server address, e.g. ssh.c2faa13dk.service.one
#   FTP_USERNAME  your account username
#   FTP_PASSWORD  your account password
# Optional repository variables (same page, "Variables" tab):
#   FTP_PORT      SFTP port, default 22
#   FTP_DIR       folder the site lives in on the server, default webroots/by-route/maxdodson.co.uk_

name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only the site itself goes to the server, not repo files like this one
      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html cv assets _site/

      - name: Upload to host over SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: ${{ vars.FTP_PORT || '22' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          ssh_private_key: ''
          local_path: ./_site/*
          remote_path: ${{ vars.FTP_DIR || 'webroots/by-route/maxdodson.co.uk_' }}
          sftp_only: true
          # Never delete anything already on the server (e.g. WordPress's files)
          delete_remote_files: false
